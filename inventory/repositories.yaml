schema: heterogeneous-compute-fabric/repositories-v1
as_of: 2026-08-27

checkout_policy:
  source_transport: git
  active_writer: one issue-owned branch in one isolated worktree
  shared_writable_checkout: forbidden
  deployment_input: immutable commit or image

repositories:
  - repo_id: heterogeneous-compute-fabric
    access_class: public
    canonical_remote: https://github.com/Kitkitkittt/heterogeneous-compute-fabric
    purpose: fabric documentation, inventories, diagrams, and bootstrap contracts
    default_branch: main
    supported_architectures: [x86_64, arm64]
    required_roles: []
    eligible_nodes: [dev-01, compute-01, cloud-01, deploy-01]
    bootstrap_command: uv sync
    verification_command: uv run fabric validate --root .
    deployment_targets: []
    secrets_required: []

private_repository_template:
  repo_id: stable-non-secret-id
  access_class: private
  canonical_remote: omitted-from-public-registry
  purpose: describe-without-sensitive-project-details
  supported_architectures: [declare-explicitly]
  required_roles: [declare-explicitly]
  eligible_nodes: [declare-explicitly]
  bootstrap_command: documented-in-private-registry
  verification_command: documented-in-private-registry
  secrets_required: [credential-reference-names-only]

